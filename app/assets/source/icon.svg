<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 200 200" role="img" aria-label="HANGER runner-frame logo">
  <!-- Source of truth for the Hanger icon. Concept: a plastic model kit
       runner (the frame sprue) forming an H. Non-builders read it as a
       stylized H; builders recognize the runner frame with attachment
       gates. Adapted from the "Runner" concept in the logo-explorations
       artifact, generated by Claude and picked by the user 2026-09-28. -->
  <rect width="200" height="200" fill="#DDE3E8"/>

  <!-- Outer runner frame -->
  <rect x="30" y="30" width="140" height="140" rx="10" fill="none" stroke="#2F3A45" stroke-width="6"/>

  <!-- Center gates (top + bottom) -->
  <circle cx="100" cy="30" r="5" fill="#2F3A45"/>
  <circle cx="100" cy="30" r="2.2" fill="#DDE3E8"/>
  <circle cx="100" cy="170" r="5" fill="#2F3A45"/>
  <circle cx="100" cy="170" r="2.2" fill="#DDE3E8"/>

  <!-- Attachment tabs — the little nubs that connect parts to the runner -->
  <g stroke="#2F3A45" stroke-linecap="round">
    <line x1="73"  y1="33"  x2="73"  y2="48" stroke-width="5"/>
    <line x1="73"  y1="48"  x2="73"  y2="56" stroke-width="2"/>
    <line x1="127" y1="33"  x2="127" y2="48" stroke-width="5"/>
    <line x1="127" y1="48"  x2="127" y2="56" stroke-width="2"/>
    <line x1="73"  y1="152" x2="73"  y2="167" stroke-width="5"/>
    <line x1="73"  y1="144" x2="73"  y2="152" stroke-width="2"/>
    <line x1="127" y1="152" x2="127" y2="167" stroke-width="5"/>
    <line x1="127" y1="144" x2="127" y2="152" stroke-width="2"/>
    <line x1="33"  y1="100" x2="53"  y2="100" stroke-width="5"/>
    <line x1="53"  y1="100" x2="62"  y2="100" stroke-width="2"/>
    <line x1="147" y1="100" x2="167" y2="100" stroke-width="5"/>
    <line x1="138" y1="100" x2="147" y2="100" stroke-width="2"/>
  </g>

  <!-- Main red H — bars + horizontal crossbar -->
  <rect x="62"  y="56" width="22" height="88" rx="3" fill="#C62828"/>
  <rect x="116" y="56" width="22" height="88" rx="3" fill="#C62828"/>
  <rect x="84"  y="92" width="32" height="16"        fill="#C62828"/>

  <!-- Highlights + shadows for a hint of 3D injection-molded look -->
  <rect x="63"  y="58"  width="3"  height="84" fill="#E35D5D"/>
  <rect x="117" y="58"  width="3"  height="84" fill="#E35D5D"/>
  <rect x="80"  y="58"  width="3"  height="34" fill="#8E1B1B"/>
  <rect x="80"  y="108" width="3"  height="34" fill="#8E1B1B"/>
  <rect x="134" y="58"  width="3"  height="84" fill="#8E1B1B"/>
  <rect x="84"  y="105" width="32" height="3"  fill="#8E1B1B"/>

  <!-- Center gate mark on the crossbar -->
  <circle cx="100" cy="99" r="3" fill="#7A1515"/>
</svg>
